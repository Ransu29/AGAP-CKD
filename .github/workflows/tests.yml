name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]   # the tested version; 3.12 is the minimum the pinned packages allow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Leakage and parameter-provenance audits
        run: |
          FEATURES=$(python -c "from agap.triage import FEATURES; print(','.join(FEATURES))")
          python .agents/skills/ckd-health-data-scientist/scripts/leakage_scanner.py --features "$FEATURES"
          python .agents/skills/ckd-health-researcher/scripts/parameter_register_validator.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
