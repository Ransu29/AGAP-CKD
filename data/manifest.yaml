- publisher: Copernicus Climate Change Service (C3S), ECMWF
  release: ERA5-Land hourly, ECMWF ARCO Zarr data lake (geo-chunked stores), served
    with the CDS key
  represented_dates: December 1990 to September 2026 (1991-2020 reference, January
    2021 to September 2026 replay), from the committed ARCO extract; CDS GRIB archives
    are committed as they arrive as a cross-check
  attribution: Contains modified Copernicus Climate Change Service information; Muñoz-Sabater
    et al. (2021), Earth System Science Data 13, 4349-4383
  crs: Regular 0.1 degree latitude-longitude grid (EPSG:4326)
  units: 2 m temperature in K (converted to °C); total precipitation in m accumulated
    from 00 UTC (converted to hourly mm)
  resolution: 0.1 degree grid (about 11 km); about 9 km native model resolution
  missing_values: Lake and sea grid points are masked (no data); incomplete local
    days and windows stay missing
  processing: Rainfall already hourly in ARCO (equal to our CDS de-accumulation within
    GRIB packing precision); rounding noise clipped; Asia/Manila local days; 7- and
    30-day windows; anomalies against the 1991-2020 monthly reference (climate/history.py);
    lakeshore cells take the nearest supported grid cell within 15 km
  id: era5_land_laguna
  path: era5_land/arco/
  url: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land
  license: CC BY 4.0
  status: 'ARCO extract: 37 yearly files, 1990-12-01T00:00 to 2026-09-30T23:00 UTC;
    CDS GRIB cross-check: 48 of 74 planned archives complete'
